limit_req_zone $binary_remote_addr zone=chartize_per_ip:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name chartize.dileepreddy.com;

    return 308 https://chartize.dileepreddy.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chartize.dileepreddy.com;

    # Cloudflare Full-mode origin TLS using the existing VPS certificate.
    ssl_certificate /etc/letsencrypt/live/getloop.ing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getloop.ing/privkey.pem;

    # Visitor address resolution for Cloudflare's published edge networks.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;


    # Keep normal Next.js page-load bursts immediate, then cap sustained
    # requests from one visitor. Rejected requests return HTTP 429.
    limit_req zone=chartize_per_ip burst=75 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    client_max_body_size 525m;

    # The application authenticates chat and authorizes admin accounts.
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Preserve streamed App Router and AI responses.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3002;
    }

    location = /api/ai/query {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3002;
    }

    location = /api/auth/callback {
        # OAuth callback logging policy.
        access_log off;
        proxy_pass http://127.0.0.1:3002;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
